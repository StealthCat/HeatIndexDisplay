name: Waveshare 2.8 smooth font migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-waveshare-28-fonts.yml'

permissions:
  contents: write

jobs:
  migrate-build-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download pinned FreeSans GFX fonts
        run: |
          set -euxo pipefail
          mkdir -p Waveshare-ESP32-S3-Touch-LCD-2.8/include/fonts
          base='https://raw.githubusercontent.com/moononournation/ArduinoFreeFontFile/e6152f4feff126afac314ba8af1ef28eff45fdeb/Fonts'
          for font in FreeSans8pt7b.h FreeSans10pt7b.h FreeSans16pt7b.h FreeSans18pt7b.h; do
            curl --fail --location --silent --show-error "$base/$font" \
              -o "Waveshare-ESP32-S3-Touch-LCD-2.8/include/fonts/$font"
          done
          grep -q 'FreeSans8pt7b' Waveshare-ESP32-S3-Touch-LCD-2.8/include/fonts/FreeSans8pt7b.h
          grep -q 'FreeSans18pt7b' Waveshare-ESP32-S3-Touch-LCD-2.8/include/fonts/FreeSans18pt7b.h

      - name: Apply smoother smaller font patch
        run: python .github/scripts/refine_waveshare_28_fonts.py

      - name: Verify rendering contract
        run: |
          set -euxo pipefail
          f=Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp
          grep -q 'FreeSans8pt7b.h' "$f"
          grep -q 'FreeSans10pt7b.h' "$f"
          grep -q 'FreeSans16pt7b.h' "$f"
          grep -q 'FreeSans18pt7b.h' "$f"
          grep -q 'gfx->setTextSize(1);' "$f"
          grep -q 'WIND MPH' "$f"
          grep -q 'HIGH / LOW' "$f"
          ! grep -q 'gfx->setTextSize(size);' "$f"
          ! grep -q 'gfx->setCursor(x + 1, y);' "$f"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Waveshare 2.8
        run: pio run -d Waveshare-ESP32-S3-Touch-LCD-2.8

      - name: Commit firmware and remove migration helpers
        run: |
          set -euxo pipefail
          rm -f .github/scripts/refine_waveshare_28_fonts.py
          rm -f .github/workflows/refine-waveshare-28-fonts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use smoother smaller fonts on Waveshare 2.8'
          git push origin HEAD:main
