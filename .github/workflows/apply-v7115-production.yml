name: Apply V7.11.5 production display refinement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply production display migration
        run: python scripts/apply_v7115_production.py

      - name: Validate patch
        run: |
          git diff --check
          git status --short
          git diff -- T-Display-S3/src/display_ui.cpp Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp README.md RELEASE_V7_11_5_PRODUCTION_DISPLAY_REFINEMENT.md

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build T-Display S3
        working-directory: T-Display-S3
        run: platformio run

      - name: Build Waveshare 2.8
        working-directory: Waveshare-ESP32-S3-Touch-LCD-2.8
        run: platformio run

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add T-Display-S3/src/display_ui.cpp \
                  Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp \
                  README.md RELEASE_V7_11_5_PRODUCTION_DISPLAY_REFINEMENT.md
          git commit -m "V7.11.5 promote emulator display refinements to production"
          git push origin HEAD:main
