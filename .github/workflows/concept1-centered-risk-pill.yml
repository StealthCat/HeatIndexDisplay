name: Apply Concept 1 centered risk pill

on:
  push:
    branches: [concept-1]
    paths:
      - tools/apply_concept1_centered_risk_pill.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout concept-1
        uses: actions/checkout@v7
        with:
          ref: concept-1
          fetch-depth: 0

      - name: Apply centered risk-pill change
        run: python tools/apply_concept1_centered_risk_pill.py

      - name: Commit firmware changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add T-Display-S3/src/display_ui.cpp Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Center Concept 1 risk pill labels"
          git push origin HEAD:concept-1
