name: Sync Concept-1 Firmware Renderers

on:
  push:
    branches: [concept-1]
    paths:
      - '.github/workflows/sync-concept1-renderers.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch emulator renderers to production firmware
        run: python3 .github/sync-concept1-renderers.py

      - name: Run emulator tests
        working-directory: emulator/concept-1
        run: python3 -m unittest discover -s tests -v

      - name: Verify current visual contract
        shell: bash
        run: |
          ! grep -q 'icon("alert"' emulator/concept-1/emulator/display_ui.py
          ! grep -q '>WEATHER STATION</text>' emulator/concept-1/preview_waveshare.svg
          grep -q 'CURRENT CONDITIONS' emulator/concept-1/preview_waveshare.svg
          grep -q 'def waveshare_7c_svg' emulator/concept-1/emulator/display_ui.py

      - name: Commit synchronized emulator
        shell: bash
        run: |
          find emulator/concept-1 -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f emulator/concept-1/emulator_config.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add emulator/concept-1 .github/concept1-emulator-v7.11.10-manifest.json
          git commit -m 'Sync Concept-1 emulator renderers with firmware'
          git push origin HEAD:concept-1
