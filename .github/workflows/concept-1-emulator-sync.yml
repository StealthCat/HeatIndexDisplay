name: Concept-1 Emulator Sync

on:
  push:
    branches: [concept-1]
  pull_request:
    branches: [concept-1]

jobs:
  verify-emulator-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify production/emulator sync
        run: node emulator/concept-1/verify-sync.mjs
