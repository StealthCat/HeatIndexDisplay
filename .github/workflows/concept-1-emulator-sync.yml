name: Concept-1 Emulator Sync

on:
  push:
    branches: [concept-1]
    paths:
      - 'README.md'
      - 'emulator/concept-1/**'
      - '.github/concept1-emulator-v7.11.10-manifest.json'
      - '.github/workflows/concept-1-emulator-sync.yml'
  pull_request:
    branches: [concept-1]
    paths:
      - 'README.md'
      - 'emulator/concept-1/**'
      - '.github/concept1-emulator-v7.11.10-manifest.json'

jobs:
  verify-emulator-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce single Markdown documentation file
        shell: bash
        run: |
          mapfile -t docs < <(find . -type f -name '*.md' -not -path './README.md' -not -path './.git/*' | sort)
          if ((${#docs[@]})); then
            printf 'Unexpected Markdown files:\n%s\n' "${docs[*]}"
            exit 1
          fi

      - name: Verify V7.11.10 functional emulator parity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('emulator/concept-1')
          manifest = json.loads(Path('.github/concept1-emulator-v7.11.10-manifest.json').read_text())
          actual = {}
          for p in root.rglob('*'):
              if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc':
                  actual[p.relative_to(root).as_posix()] = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = manifest['files']
          missing = sorted(set(expected) - set(actual))
          extra = sorted(set(actual) - set(expected))
          changed = sorted(k for k in set(expected) & set(actual) if expected[k] != actual[k])
          if missing or extra or changed:
              print('Missing:', missing)
              print('Extra:', extra)
              print('Changed:', changed)
              raise SystemExit(1)
          if len(actual) != manifest['file_count']:
              raise SystemExit(f"file count mismatch: {len(actual)} != {manifest['file_count']}")
          print(f"Functional emulator parity OK: {len(actual)} files from {manifest['archive']}")
          PY

      - name: Verify Waveshare 7C-BOX target
        shell: bash
        run: |
          grep -q 'def waveshare_7c_svg' emulator/concept-1/emulator/display_ui.py
          grep -q '/render/waveshare-7c.svg' emulator/concept-1/emulator/web_ui.py
          grep -q 'Waveshare 7C BOX · 800×480' emulator/concept-1/emulator/web_ui.py
          test -f emulator/concept-1/preview_waveshare_7c_box.svg
          test -f emulator/concept-1/tests/test_waveshare_7c_box.py

      - name: Run full emulator tests
        working-directory: emulator/concept-1
        run: python3 -m unittest discover -s tests -v
