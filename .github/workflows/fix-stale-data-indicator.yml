name: Fix stale data indicator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-stale-data-indicator.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fix stale semantics in firmware and emulator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          fw_paths = [
              Path('T-Display-S3/src/time_utils.cpp'),
              Path('Waveshare-ESP32-S3-Touch-LCD-2.8/src/time_utils.cpp'),
              Path('Waveshare-ESP32-S3-Touch-LCD-7C-BOX/src/time_utils.cpp'),
          ]
          old_fw = '''bool dataStale() {
            return wx.valid && observationAgeSeconds() > cfg.staleSeconds;
          }'''
          new_fw = '''bool dataStale() {
            // STALE reflects failure to receive a successful API update, not the
            // provider station's observation timestamp. Some PWS/cloud feeds
            // legitimately publish observations several minutes behind real time.
            if (!wx.valid || wx.fetchedMs == 0) return false;
            return ((millis() - wx.fetchedMs) / 1000UL) > cfg.staleSeconds;
          }'''
          for path in fw_paths:
              src = path.read_text(encoding='utf-8')
              if old_fw not in src:
                  raise SystemExit(f'Expected stale function not found in {path}')
              path.write_text(src.replace(old_fw, new_fw, 1), encoding='utf-8')

          emu_path = Path('emulator/concept-1/emulator/display_ui.py')
          emu = emu_path.read_text(encoding='utf-8')
          old_emu = '''def is_stale(cfg: AppConfig, wx: WeatherData):
              return bool(
                  wx.valid
                  and wx.date_utc_ms
                  and ((time.time() * 1000 - wx.date_utc_ms) > cfg.stale_seconds * 1000)
              )'''
          new_emu = '''def is_stale(cfg: AppConfig, wx: WeatherData):
              # Match firmware: stale means no successful fetch within the stale
              # interval. Provider observation timestamps can legitimately lag.
              return bool(
                  wx.valid
                  and wx.fetched_monotonic
                  and ((time.monotonic() - wx.fetched_monotonic) > cfg.stale_seconds)
              )'''
          if old_emu not in emu:
              raise SystemExit('Expected emulator stale function not found')
          emu_path.write_text(emu.replace(old_emu, new_emu, 1), encoding='utf-8')

          test_path = Path('emulator/concept-1/tests/test_stale_semantics.py')
          test_path.write_text('''import time\n\nfrom emulator.app_controller import EmulatorApp\nfrom emulator.display_ui import is_stale, tdisplay_svg, waveshare_svg, waveshare_7c_svg\n\n\ndef _renders(app):\n    return [\n        tdisplay_svg(app.config, app.wx),\n        waveshare_svg(app.config, app.wx),\n        waveshare_7c_svg(app.config, app.wx),\n    ]\n\n\ndef test_old_provider_timestamp_does_not_make_recent_fetch_stale():\n    app = EmulatorApp(verbose=False)\n    app.apply_preset("heat")\n    app.wx.date_utc_ms = int((time.time() - 3600) * 1000)\n    app.wx.fetched_monotonic = time.monotonic()\n\n    assert not is_stale(app.config, app.wx)\n    for svg in _renders(app):\n        assert "ONLINE" in svg\n        assert "STALE" not in svg\n\n\ndef test_failed_refresh_window_makes_data_stale():\n    app = EmulatorApp(verbose=False)\n    app.apply_preset("heat")\n    app.wx.date_utc_ms = int(time.time() * 1000)\n    app.wx.fetched_monotonic = time.monotonic() - app.config.stale_seconds - 1\n\n    assert is_stale(app.config, app.wx)\n    for svg in _renders(app):\n        assert "STALE" in svg\n\n\ndef test_firmware_uses_fetch_age_for_stale_state():\n    from pathlib import Path\n    root = Path(__file__).resolve().parents[3]\n    paths = [\n        root / "T-Display-S3/src/time_utils.cpp",\n        root / "Waveshare-ESP32-S3-Touch-LCD-2.8/src/time_utils.cpp",\n        root / "Waveshare-ESP32-S3-Touch-LCD-7C-BOX/src/time_utils.cpp",\n    ]\n    for path in paths:\n        src = path.read_text(encoding="utf-8")\n        assert "millis() - wx.fetchedMs" in src\n        assert "observationAgeSeconds() > cfg.staleSeconds" not in src\n''', encoding='utf-8')

          manifest_path = Path('.github/concept1-emulator-v7.11.10-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['files']['emulator/display_ui.py'] = hashlib.sha256(emu_path.read_bytes()).hexdigest()
          manifest['files']['tests/test_stale_semantics.py'] = hashlib.sha256(test_path.read_bytes()).hexdigest()
          manifest['file_count'] = len(manifest['files'])
          for path in fw_paths:
              rel = path.as_posix()
              manifest['firmware_sources'][rel] = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install verification dependencies
        run: python -m pip install pytest platformio

      - name: Verify manifest parity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('.')
          manifest = json.loads((root / '.github/concept1-emulator-v7.11.10-manifest.json').read_text())
          for rel, expected in manifest['files'].items():
              actual = hashlib.sha256((root / 'emulator/concept-1' / rel).read_bytes()).hexdigest()
              assert actual == expected, (rel, actual, expected)
          for rel, expected in manifest['firmware_sources'].items():
              actual = hashlib.sha256((root / rel).read_bytes()).hexdigest()
              assert actual == expected, (rel, actual, expected)
          print('Manifest parity verified')
          PY

      - name: Run emulator tests
        working-directory: emulator/concept-1
        run: python -m pytest -q

      - name: Build T-Display-S3
        working-directory: T-Display-S3
        run: platformio run

      - name: Build Waveshare 2.8
        working-directory: Waveshare-ESP32-S3-Touch-LCD-2.8
        run: platformio run

      - name: Build Waveshare 7C BOX
        working-directory: Waveshare-ESP32-S3-Touch-LCD-7C-BOX
        run: platformio run

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-stale-data-indicator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix persistent stale data indicator"
          git push origin HEAD:main
