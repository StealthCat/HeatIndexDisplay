name: Restore Concept-1 Emulator ZIP

on:
  push:
    branches: [concept-1]
    paths:
      - '.github/tmp/concept1-zip/**'

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Mirror Concept-1 emulator V7.11.9 downloadable ZIP'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct canonical ZIP
        shell: bash
        run: |
          cat .github/tmp/concept1-zip/*.b64 | base64 -d > /tmp/concept1.zip
          echo '2c74b84b08e240e6c1c30f4b8410ca6a9a955cb416b8cfbca77d180d95379059  /tmp/concept1.zip' | sha256sum -c -

      - name: Replace emulator with exact ZIP contents
        shell: bash
        run: |
          rm -rf emulator/concept-1 /tmp/concept1-unpacked
          mkdir -p emulator/concept-1 /tmp/concept1-unpacked
          unzip -q /tmp/concept1.zip -d /tmp/concept1-unpacked
          root="$(find /tmp/concept1-unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$root"
          cp -a "$root"/. emulator/concept-1/

      - name: Verify exact downloadable ZIP manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('emulator/concept-1')
          manifest = json.loads(Path('.github/concept1-emulator-v7.11.9-manifest.json').read_text())
          actual = {}
          for p in root.rglob('*'):
              if p.is_file():
                  actual[p.relative_to(root).as_posix()] = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = manifest['files']
          missing = sorted(set(expected) - set(actual))
          extra = sorted(set(actual) - set(expected))
          changed = sorted(k for k in set(expected) & set(actual) if expected[k] != actual[k])
          if missing or extra or changed:
              raise SystemExit(f'manifest mismatch: missing={missing}, extra={extra}, changed={changed}')
          print(f"Manifest OK: {len(actual)} files match {manifest['archive']} exactly")
          PY

      - name: Run emulator test suite
        working-directory: emulator/concept-1
        run: python3 -m unittest discover -s tests -v

      - name: Commit exact ZIP mirror
        shell: bash
        run: |
          rm -rf .github/tmp/concept1-zip
          find emulator/concept-1 -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f emulator/concept-1/emulator_config.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Mirror Concept-1 emulator V7.11.9 downloadable ZIP'
          git push origin HEAD:concept-1
