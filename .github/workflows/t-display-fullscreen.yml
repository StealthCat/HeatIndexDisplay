name: T-Display fullscreen UI migration

on:
  push:
    branches: [t-display]
    paths:
      - '.github/workflows/t-display-fullscreen.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout t-display
        uses: actions/checkout@v7
        with:
          ref: t-display

      - name: Apply fullscreen UI migration
        run: python3 .github/t-display-fullscreen.py

      - name: Verify fullscreen contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'BUTTON_BOOT_PIN = 0' T-Display-S3/src/main.cpp
          grep -q 'BUTTON_USER_PIN = 14' T-Display-S3/src/main.cpp
          grep -q 'toggleDisplayPage();' T-Display-S3/src/main.cpp
          grep -q 'static void drawFullScreenHero()' T-Display-S3/src/display_ui.cpp
          grep -q 'static void drawDetailsScreen()' T-Display-S3/src/display_ui.cpp
          grep -q 'EITHER BUTTON: DETAILS' T-Display-S3/src/display_ui.cpp
          grep -q 'EITHER BUTTON: HEAT INDEX' T-Display-S3/src/display_ui.cpp

      - name: Install PlatformIO
        run: python3 -m pip install --upgrade platformio

      - name: Build modified T-Display firmware
        working-directory: T-Display-S3
        run: platformio run

      - name: Commit branch changes and remove migration helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/t-display-fullscreen.yml .github/t-display-fullscreen.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add T-Display-S3/include/display_ui.h T-Display-S3/src/main.cpp T-Display-S3/src/display_ui.cpp .github/workflows/t-display-fullscreen.yml .github/t-display-fullscreen.py
          git commit -m 'Add button-switched fullscreen T-Display views'
          git push origin t-display
