name: Publish V7.8 provider REST summaries

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v78-rest-summary.yml

permissions:
  contents: write

jobs:
  migrate-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply V7.8 REST summary changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          projects = [
              Path('T-Display-S3'),
              Path('Waveshare-ESP32-S3-Touch-LCD-2.8'),
          ]

          ambient_summary = r'''bool fetchAmbientSummary(String &errorOut) {
            errorOut = "";

            if (WiFi.status() != WL_CONNECTED) {
              errorOut = "Wi-Fi is not connected";
              return false;
            }
            if (!ambientConfigured() || !cfg.macAddress.length()) {
              errorOut = "Ambient credentials/station are not configured";
              return false;
            }
            if (!wx.valid || wx.dateUtcMs == 0) {
              errorOut = "Current observation is not available";
              return false;
            }

            // Ambient's REST history endpoint is the authoritative source for
            // the summary values shown on the display. Use an explicit current
            // history window for today's high/low and a second request ending at
            // the same local clock time yesterday for From Yesterday.
            auto fetchHistory = [&](uint64_t endDateMs,
                                    uint16_t limit,
                                    DynamicJsonDocument &doc,
                                    String &requestError) -> bool {
              requestError = "";

              char endDateBuf[24];
              snprintf(endDateBuf, sizeof(endDateBuf), "%llu",
                       (unsigned long long)endDateMs);

              String url = String(AMBIENT_DEVICES_URL) + "/" + cfg.macAddress;
              url += "?apiKey=";
              url += urlEncode(cfg.apiKey);
              url += "&applicationKey=";
              url += urlEncode(cfg.applicationKey);
              url += "&endDate=";
              url += endDateBuf;
              url += "&limit=";
              url += String(limit);

              WiFiClientSecure client;
              client.setInsecure();
              client.setTimeout(12);

              HTTPClient http;
              http.setConnectTimeout(10000);
              http.setTimeout(15000);
              http.setUserAgent("WS5000-ApparentTemp-ESP32/7.8");

              respectAmbientRateLimit();

              if (!http.begin(client, url)) {
                requestError = "Unable to initialize Ambient REST history request";
                return false;
              }

              int code = http.GET();
              lastAmbientRequestMs = millis();
              lastSummaryHttpCode = code;

              if (code != HTTP_CODE_OK) {
                String body = http.getString();
                body.trim();
                if (body.length() > 160) body = body.substring(0, 160);
                requestError = "Ambient REST history HTTP " + String(code);
                if (body.length()) {
                  requestError += ": ";
                  requestError += body;
                }
                http.end();
                return false;
              }

              StaticJsonDocument<96> filter;
              filter[0]["dateutc"] = true;
              filter[0]["tempf"] = true;

              DeserializationError jsonErr = deserializeJson(
                doc,
                http.getStream(),
                DeserializationOption::Filter(filter)
              );
              http.end();

              if (jsonErr) {
                requestError = "Ambient REST history JSON error: " + String(jsonErr.c_str());
                return false;
              }
              if (!doc.is<JsonArray>() || doc.size() == 0) {
                requestError = "Ambient REST history returned no observations";
                return false;
              }
              return true;
            };

            DynamicJsonDocument todayDoc(18432);
            String todayError;
            if (!fetchHistory(wx.dateUtcMs, 288, todayDoc, todayError)) {
              errorOut = todayError;
              return false;
            }

            float high = wx.tempF;
            float low = wx.tempF;

            for (JsonObject point : todayDoc.as<JsonArray>()) {
              uint64_t pointMs = point["dateutc"] | 0ULL;
              float pointTemp = tryField(point, "tempf");
              if (pointMs == 0 || !isfinite(pointTemp)) continue;

              if (sameLocalDay(pointMs, wx.dateUtcMs)) {
                if (!isfinite(high) || pointTemp > high) high = pointTemp;
                if (!isfinite(low) || pointTemp < low) low = pointTemp;
              }
            }

            // Compute "same local clock time yesterday" rather than blindly
            // subtracting 24 hours so DST transitions remain correct.
            time_t currentSec = (time_t)(wx.dateUtcMs / 1000ULL);
            struct tm yesterdayTm;
            localtime_r(&currentSec, &yesterdayTm);
            yesterdayTm.tm_mday -= 1;
            yesterdayTm.tm_isdst = -1;
            time_t yesterdaySec = mktime(&yesterdayTm);
            uint64_t targetYesterdayMs = yesterdaySec > 0
                                       ? (uint64_t)yesterdaySec * 1000ULL
                                       : 0ULL;

            // Today's high/low are already valid REST-derived values. Commit
            // them even if the separate yesterday request fails, and preserve
            // any previously successful From Yesterday value in that case.
            wx.todayHighF = high;
            wx.todayLowF = low;
            wx.summaryValid = isfinite(wx.todayHighF) && isfinite(wx.todayLowF);
            wx.summaryFetchedMs = millis();

            if (targetYesterdayMs == 0) {
              errorOut = "Unable to determine Ambient yesterday target time";
              return false;
            }

            DynamicJsonDocument yesterdayDoc(1024);
            String yesterdayError;
            if (!fetchHistory(targetYesterdayMs, 2, yesterdayDoc, yesterdayError)) {
              errorOut = yesterdayError;
              return false;
            }

            float yesterday = NAN;
            uint64_t bestYesterdayDifference = UINT64_MAX;

            for (JsonObject point : yesterdayDoc.as<JsonArray>()) {
              uint64_t pointMs = point["dateutc"] | 0ULL;
              float pointTemp = tryField(point, "tempf");
              if (pointMs == 0 || !isfinite(pointTemp)) continue;

              uint64_t delta = pointMs > targetYesterdayMs
                             ? pointMs - targetYesterdayMs
                             : targetYesterdayMs - pointMs;
              if (delta < bestYesterdayDifference) {
                bestYesterdayDifference = delta;
                yesterday = pointTemp;
              }
            }

            if (!isfinite(yesterday)) {
              errorOut = "Ambient REST history did not contain yesterday temperature";
              return false;
            }

            wx.yesterdayTempF = yesterday;
            wx.fromYesterdayF = wx.tempF - yesterday;
            wx.summaryFetchedMs = millis();

            Serial.printf(
              "Ambient REST summary: high=%.2fF low=%.2fF yesterday=%.2fF delta=%+.2fF\n",
              wx.todayHighF, wx.todayLowF, wx.yesterdayTempF, wx.fromYesterdayF
            );
            return true;
          }'''

          wu_daily_helper = r'''static bool fetchDailyHistoryDate(const String &dateYmd,
                                        DynamicJsonDocument &doc,
                                        String &errorOut) {
            errorOut = "";
            if (WiFi.status() != WL_CONNECTED) {
              errorOut = "Wi-Fi is not connected";
              return false;
            }
            if (!weatherUndergroundConfigured()) {
              errorOut = "Weather Underground API key/station ID are not configured";
              return false;
            }
            if (!dateYmd.length()) {
              errorOut = "Unable to determine daily history date";
              return false;
            }

            String url = String(WUNDERGROUND_DAILY_HISTORY_URL);
            url += "?stationId=";
            url += wuUrlEncode(cfg.wuStationId);
            url += "&format=json&units=e&date=";
            url += dateYmd;
            url += "&numericPrecision=decimal&apiKey=";
            url += wuUrlEncode(cfg.wuApiKey);

            WiFiClientSecure client;
            client.setInsecure();
            client.setTimeout(12);

            HTTPClient http;
            http.setConnectTimeout(10000);
            http.setTimeout(15000);
            http.setUserAgent("WS5000-ApparentTemp-ESP32/7.8");

            respectWundergroundRateLimit();

            if (!http.begin(client, url)) {
              errorOut = "Unable to initialize Weather Underground daily REST request";
              return false;
            }

            int code = http.GET();
            lastWundergroundRequestMs = millis();
            lastSummaryHttpCode = code;

            if (code != HTTP_CODE_OK) {
              String body = http.getString();
              body.trim();
              if (body.length() > 160) body = body.substring(0, 160);
              errorOut = "Weather Underground daily REST HTTP " + String(code);
              if (body.length()) {
                errorOut += ": ";
                errorOut += body;
              }
              http.end();
              return false;
            }

            StaticJsonDocument<192> filter;
            filter["observations"][0]["imperial"]["tempHigh"] = true;
            filter["observations"][0]["imperial"]["tempLow"] = true;
            filter["observations"][0]["imperial"]["windgustHigh"] = true;

            DeserializationError jsonErr = deserializeJson(
              doc,
              http.getStream(),
              DeserializationOption::Filter(filter)
            );
            http.end();

            if (jsonErr) {
              errorOut = "Weather Underground daily REST JSON error: " + String(jsonErr.c_str());
              return false;
            }

            JsonArray observations = doc["observations"].as<JsonArray>();
            if (observations.isNull() || observations.size() == 0) {
              errorOut = "Weather Underground daily REST returned no observations for " + dateYmd;
              return false;
            }
            return true;
          }

          static bool summarizeWundergroundAllHistory(const String &dateYmd,
                                                       float &high,
                                                       float &low,
                                                       float &maxGust,
                                                       String &errorOut) {
            DynamicJsonDocument allDoc(32768);
            if (!fetchHistoryDate(dateYmd, allDoc, errorOut)) return false;

            for (JsonObject point : allDoc["observations"].as<JsonArray>()) {
              JsonObject imperial = point["imperial"].as<JsonObject>();
              float pointHigh = wuFloat(imperial["tempHigh"]);
              float pointLow = wuFloat(imperial["tempLow"]);
              float pointGust = wuFloat(imperial["windgustHigh"]);

              if (isfinite(pointHigh) && (!isfinite(high) || pointHigh > high)) high = pointHigh;
              if (isfinite(pointLow) && (!isfinite(low) || pointLow < low)) low = pointLow;
              if (isfinite(pointGust) && (!isfinite(maxGust) || pointGust > maxGust)) {
                maxGust = pointGust;
              }
            }
            return isfinite(high) && isfinite(low);
          }

          '''

          wu_summary = r'''bool fetchWeatherUndergroundSummary(String &errorOut) {
            errorOut = "";
            if (!wx.valid || wx.dateUtcMs == 0) {
              errorOut = "Current observation is not available";
              return false;
            }

            // Use local calendar arithmetic so "From Yesterday" is the same
            // local clock time even across DST transitions.
            time_t currentSec = (time_t)(wx.dateUtcMs / 1000ULL);
            struct tm yesterdayTm;
            localtime_r(&currentSec, &yesterdayTm);
            yesterdayTm.tm_mday -= 1;
            yesterdayTm.tm_isdst = -1;
            time_t yesterdaySec = mktime(&yesterdayTm);
            uint64_t targetYesterdayMs = yesterdaySec > 0
                                       ? (uint64_t)yesterdaySec * 1000ULL
                                       : 0ULL;

            String todayYmd = localDateYmd(wx.dateUtcMs);
            String yesterdayYmd = localDateYmd(targetYesterdayMs);
            if (!todayYmd.length() || !yesterdayYmd.length()) {
              errorOut = "Unable to determine Weather Underground REST history dates";
              return false;
            }

            float high = wx.tempF;
            float low = wx.tempF;
            float maxGust = isfinite(wx.gustMph) ? wx.gustMph : NAN;

            // Prefer the provider's daily summary REST endpoint for today's
            // high/low and maximum gust. If a current-day daily summary is not
            // yet available, fall back to the all-observations REST endpoint.
            DynamicJsonDocument dailyDoc(4096);
            String dailyError;
            bool dailyOk = fetchDailyHistoryDate(todayYmd, dailyDoc, dailyError);
            if (dailyOk) {
              for (JsonObject point : dailyDoc["observations"].as<JsonArray>()) {
                JsonObject imperial = point["imperial"].as<JsonObject>();
                float pointHigh = wuFloat(imperial["tempHigh"]);
                float pointLow = wuFloat(imperial["tempLow"]);
                float pointGust = wuFloat(imperial["windgustHigh"]);

                if (isfinite(pointHigh) && (!isfinite(high) || pointHigh > high)) high = pointHigh;
                if (isfinite(pointLow) && (!isfinite(low) || pointLow < low)) low = pointLow;
                if (isfinite(pointGust) && (!isfinite(maxGust) || pointGust > maxGust)) {
                  maxGust = pointGust;
                }
              }
            }

            if (!dailyOk || !isfinite(high) || !isfinite(low)) {
              String fallbackError;
              if (!summarizeWundergroundAllHistory(todayYmd, high, low, maxGust, fallbackError)) {
                errorOut = dailyError;
                if (errorOut.length() && fallbackError.length()) errorOut += "; fallback: ";
                errorOut += fallbackError;
                return false;
              }
            }

            // Commit today's REST-derived summary before the independent
            // yesterday request. If yesterday fails, retain any previous delta
            // while still updating high/low from the provider.
            wx.todayHighF = high;
            wx.todayLowF = low;
            wx.maxDailyGustMph = maxGust;
            wx.summaryValid = isfinite(wx.todayHighF) && isfinite(wx.todayLowF);
            wx.summaryFetchedMs = millis();

            DynamicJsonDocument yesterdayDoc(32768);
            String yesterdayError;
            if (!fetchHistoryDate(yesterdayYmd, yesterdayDoc, yesterdayError)) {
              errorOut = yesterdayError;
              return false;
            }

            float yesterday = NAN;
            uint64_t bestDifference = UINT64_MAX;

            for (JsonObject point : yesterdayDoc["observations"].as<JsonArray>()) {
              uint64_t epoch = point["epoch"] | 0ULL;
              JsonObject imperial = point["imperial"].as<JsonObject>();
              float pointTemp = wuFloat(imperial["tempAvg"]);
              if (epoch == 0 || !isfinite(pointTemp)) continue;

              uint64_t pointMs = epoch * 1000ULL;
              uint64_t delta = pointMs > targetYesterdayMs
                             ? pointMs - targetYesterdayMs
                             : targetYesterdayMs - pointMs;
              if (delta < bestDifference) {
                bestDifference = delta;
                yesterday = pointTemp;
              }
            }

            if (!isfinite(yesterday)) {
              errorOut = "Weather Underground REST history did not contain yesterday temperature";
              return false;
            }

            wx.yesterdayTempF = yesterday;
            wx.fromYesterdayF = wx.tempF - yesterday;
            wx.summaryFetchedMs = millis();

            Serial.printf(
              "Weather Underground REST summary: high=%.2fF low=%.2fF yesterday=%.2fF delta=%+.2fF\n",
              wx.todayHighF, wx.todayLowF, wx.yesterdayTempF, wx.fromYesterdayF
            );
            return true;
          }'''

          for project in projects:
              config = project / 'include' / 'config.h'
              text = config.read_text(encoding='utf-8')
              if 'WUNDERGROUND_DAILY_HISTORY_URL' not in text:
                  text = text.replace(
                      '#define WUNDERGROUND_HISTORY_URL  "https://api.weather.com/v2/pws/history/all"',
                      '#define WUNDERGROUND_HISTORY_URL  "https://api.weather.com/v2/pws/history/all"\n'
                      '#define WUNDERGROUND_DAILY_HISTORY_URL "https://api.weather.com/v2/pws/history/daily"'
                  )
              config.write_text(text, encoding='utf-8')

              ambient = project / 'src' / 'ambient_weather.cpp'
              text = ambient.read_text(encoding='utf-8')
              text = text.replace('WS5000-ApparentTemp-ESP32/4.0', 'WS5000-ApparentTemp-ESP32/7.8')
              text, count = re.subn(
                  r'bool fetchAmbientSummary\(String &errorOut\) \{.*?\n\}\n\nbool pollAmbient',
                  ambient_summary + '\n\nbool pollAmbient',
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'Failed to replace Ambient summary in {ambient}')
              ambient.write_text(text, encoding='utf-8')

              wu = project / 'src' / 'wunderground_weather.cpp'
              text = wu.read_text(encoding='utf-8')
              text = text.replace('WS5000-ApparentTemp-ESP32/7.7', 'WS5000-ApparentTemp-ESP32/7.8')
              marker = 'bool fetchWeatherUndergroundCurrent(String &errorOut) {'
              if 'fetchDailyHistoryDate(' not in text:
                  if marker not in text:
                      raise SystemExit(f'WU current marker missing in {wu}')
                  text = text.replace(marker, wu_daily_helper + marker, 1)
              text, count = re.subn(
                  r'bool fetchWeatherUndergroundSummary\(String &errorOut\) \{.*?\n\}\n\nbool pollWeatherUnderground',
                  wu_summary + '\n\nbool pollWeatherUnderground',
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'Failed to replace WU summary in {wu}')
              wu.write_text(text, encoding='utf-8')

              web = project / 'src' / 'web_ui.cpp'
              text = web.read_text(encoding='utf-8')
              text = text.replace(
                  "The selected source is used for current conditions and the historical data behind From Yesterday and Today's High / Low.",
                  "The selected source is used for current conditions and its REST history API supplies From Yesterday and Today's High / Low."
              )
              web.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('## Current release: V7.7', '## Current release: V7.8', 1)
          text = text.replace(
              'V7.7 keeps the approved production layouts and adds a selectable weather-data provider. Both boards can now use either Ambient Weather or Weather Underground PWS current/history APIs while retaining From Yesterday, Today\'s High/Low, persistent web configuration, first-boot defaults, and the V7.6 modular architecture.',
              'V7.8 keeps the approved production layouts and selectable weather provider, and makes the displayed Today High/Low and From Yesterday values explicitly REST-derived from the configured provider. Ambient uses its device-history REST API; Weather Underground uses its PWS daily/all-history REST APIs with fallback handling.'
          )
          if '## Production Release V7.8' not in text:
              text += '''\n\n## Production Release V7.8\n\nToday High/Low and From Yesterday are fetched from the REST history API belonging to the selected weather source. Ambient uses explicit current and same-local-time-yesterday history queries. Weather Underground prefers the daily-summary REST endpoint for Today High/Low and uses all-history data for the same local time yesterday, with an all-history fallback for the current-day summary. See `RELEASE_V7_8_PROVIDER_REST_SUMMARY.md`.\n'''
          readme.write_text(text, encoding='utf-8')

          Path('RELEASE_V7_8_PROVIDER_REST_SUMMARY.md').write_text('''# Production Release V7.8 — Provider REST Summary Data\n\nV7.8 makes the display summary fields explicitly source-aware and REST-derived.\n\n## Ambient Weather\n\n- Current conditions continue to come from `/v1/devices`.\n- Today High/Low come from `/v1/devices/{macAddress}` with an explicit `endDate` at the current observation and `limit=288`.\n- From Yesterday is fetched with a second `/v1/devices/{macAddress}` REST request ending at the same local clock time on the prior calendar day.\n- Requests retain the existing Ambient 1 request/second spacing.\n\n## Weather Underground\n\n- Current conditions continue to come from `/v2/pws/observations/current`.\n- Today High/Low prefer `/v2/pws/history/daily` for the current local date.\n- If the current-day daily summary is unavailable, firmware falls back to `/v2/pws/history/all`.\n- From Yesterday uses `/v2/pws/history/all` for the prior local date and selects the observation nearest the same local clock time.\n\n## Reliability\n\n- Local-calendar arithmetic is used for yesterday so DST transitions do not shift the comparison by an hour.\n- A failure of the separate yesterday REST request does not discard a successfully refreshed Today High/Low summary. Previously successful From Yesterday data is retained until the provider returns a new value.\n- The configured weather source remains the dispatcher for both current and historical REST requests.\n''', encoding='utf-8')

          # Static assertions before compiling.
          for project in projects:
              ambient = (project / 'src' / 'ambient_weather.cpp').read_text(encoding='utf-8')
              wu = (project / 'src' / 'wunderground_weather.cpp').read_text(encoding='utf-8')
              config = (project / 'include' / 'config.h').read_text(encoding='utf-8')
              assert '&endDate=' in ambient and 'Ambient REST summary:' in ambient
              assert 'WUNDERGROUND_DAILY_HISTORY_URL' in config
              assert 'fetchDailyHistoryDate' in wu
              assert 'Weather Underground REST summary:' in wu
              assert 'mktime(&yesterdayTm)' in ambient and 'mktime(&yesterdayTm)' in wu

          print('V7.8 REST summary source changes applied to both production projects.')
          PY

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build T-Display S3
        working-directory: T-Display-S3
        run: platformio run

      - name: Build Waveshare 2.8
        working-directory: Waveshare-ESP32-S3-Touch-LCD-2.8
        run: platformio run

      - name: Commit and publish V7.8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md RELEASE_V7_8_PROVIDER_REST_SUMMARY.md \
            T-Display-S3/include/config.h T-Display-S3/src/ambient_weather.cpp T-Display-S3/src/wunderground_weather.cpp T-Display-S3/src/web_ui.cpp \
            Waveshare-ESP32-S3-Touch-LCD-2.8/include/config.h Waveshare-ESP32-S3-Touch-LCD-2.8/src/ambient_weather.cpp Waveshare-ESP32-S3-Touch-LCD-2.8/src/wunderground_weather.cpp Waveshare-ESP32-S3-Touch-LCD-2.8/src/web_ui.cpp
          git commit -m "V7.8 use configured provider REST APIs for summary data"
          git push
