name: T-Display landscape migration

on:
  push:
    branches: [t-display]
    paths:
      - '.github/workflows/t-display-landscape.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout t-display
        uses: actions/checkout@v7
        with:
          ref: t-display

      - name: Apply landscape UI
        run: python3 .github/t-display-landscape.py

      - name: Verify landscape contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'display.setRotation(1);' T-Display-S3/src/display_ui.cpp
          grep -q 'drawFastHLine(0, y, 320' T-Display-S3/src/display_ui.cpp
          grep -q 'static void drawDetailsScreen()' T-Display-S3/src/display_ui.cpp
          grep -q 'EITHER BUTTON: DETAILS' T-Display-S3/src/display_ui.cpp
          grep -q 'EITHER BUTTON: HEAT INDEX' T-Display-S3/src/display_ui.cpp
          grep -q 'BUTTON_BOOT_PIN = 0' T-Display-S3/src/main.cpp
          grep -q 'BUTTON_USER_PIN = 14' T-Display-S3/src/main.cpp

      - name: Install PlatformIO
        run: python3 -m pip install --upgrade platformio

      - name: Build modified T-Display firmware
        working-directory: T-Display-S3
        run: platformio run

      - name: Commit landscape firmware and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/t-display-landscape.yml .github/t-display-landscape.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add T-Display-S3/src/display_ui.cpp .github/workflows/t-display-landscape.yml .github/t-display-landscape.py
          git commit -m 'Rotate T-Display UI to landscape layout'
          git push origin t-display
