name: T-Display native-font readability pass

on:
  push:
    branches: [t-display]
    paths:
      - '.github/workflows/t-display-font-pass.yml'
      - '.github/t-display-font-pass.py'

permissions:
  contents: write

jobs:
  patch-build-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout t-display
        uses: actions/checkout@v7
        with:
          ref: t-display

      - name: Apply native-font readability patch
        run: python3 .github/t-display-font-pass.py

      - name: Verify readability contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'display.setFont(&fonts::Font2);' T-Display-S3/src/display_ui.cpp
          grep -q 'drawBoldText(apparentRiskLabel(), 250, 70' T-Display-S3/src/display_ui.cpp
          grep -q 'display.drawString("RISK", 250, 41)' T-Display-S3/src/display_ui.cpp
          grep -q 'BUTTON: DETAILS' T-Display-S3/src/display_ui.cpp
          grep -q 'BUTTON: HEAT INDEX' T-Display-S3/src/display_ui.cpp
          ! grep -Eq 'setTextSize\(0\.(54|58|62|68|70|72|74|78|80|82)f\)' T-Display-S3/src/display_ui.cpp

      - name: Install PlatformIO
        run: python3 -m pip install --upgrade platformio

      - name: Build T-Display S3
        working-directory: T-Display-S3
        run: platformio run

      - name: Commit firmware and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/t-display-font-pass.yml .github/t-display-font-pass.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add T-Display-S3/src/display_ui.cpp .github/workflows/t-display-font-pass.yml .github/t-display-font-pass.py
          git commit -m 'Use native fonts for T-Display readability'
          git push origin t-display
