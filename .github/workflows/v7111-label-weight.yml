name: Publish V7.11.1 label readability

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply V7.11.1 readability tweak
        run: python .github/scripts/v7111_label_weight.py
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build T-Display S3
        working-directory: T-Display-S3
        run: platformio run
      - name: Build Waveshare 2.8
        working-directory: Waveshare-ESP32-S3-Touch-LCD-2.8
        run: platformio run
      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add T-Display-S3/src/display_ui.cpp Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp
          git commit -m 'V7.11.1 strengthen compact-card text'
          git push
