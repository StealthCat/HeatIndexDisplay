name: Fix Waveshare 2.8 risk pill

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_waveshare28_risk_pill.py'
      - '.github/workflows/fix-waveshare28-risk-pill.yml'

permissions:
  contents: write

jobs:
  patch-build-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply adaptive risk-pill patch
        run: python .github/scripts/fix_waveshare28_risk_pill.py

      - name: Verify risk-pill contract
        run: |
          grep -F 'tDisplayTextWidth(riskLabelText, 2) <= 96' Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp
          grep -F 'substring(0, split)' Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp
          grep -F 'substring(split + 1)' Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build Waveshare 2.8
        run: pio run -d Waveshare-ESP32-S3-Touch-LCD-2.8

      - name: Commit firmware and remove helpers
        run: |
          rm -f .github/scripts/fix_waveshare28_risk_pill.py
          rm -f .github/workflows/fix-waveshare28-risk-pill.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp
          git add -u .github/scripts .github/workflows
          git commit -m 'Fit long Waveshare 2.8 risk labels'
          git push origin HEAD:main
