name: Publish V7.5.1 direction helper fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v7-5-1-direction-fix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Waveshare main.cpp
        run: python -c "import base64; exec(base64.b64decode('').decode('utf-8'))"
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Waveshare-ESP32-S3-Touch-LCD-2.8/src/main.cpp
          git commit -m "Fix Waveshare directionLongText build error"
          git push
