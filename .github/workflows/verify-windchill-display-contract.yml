name: Verify wind-chill display contract

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/verify_windchill_display_contract.py'
      - '.github/workflows/verify-windchill-display-contract.yml'

permissions:
  contents: write

jobs:
  verify-build-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify and fix wind-chill display contract
        run: python3 tools/verify_windchill_display_contract.py

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build T-Display S3
        run: pio run -d T-Display-S3

      - name: Build Waveshare 2.8
        run: pio run -d Waveshare-ESP32-S3-Touch-LCD-2.8

      - name: Build Waveshare 7C BOX
        run: pio run -d Waveshare-ESP32-S3-Touch-LCD-7C-BOX

      - name: Commit fix and remove helpers
        run: |
          rm -f tools/verify_windchill_display_contract.py .github/workflows/verify-windchill-display-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep wind-chill display state consistent' || exit 0
          git push origin HEAD:main
