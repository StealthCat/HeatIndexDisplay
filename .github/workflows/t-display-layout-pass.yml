name: T-Display layout cleanup

on:
  push:
    branches: [t-display]
    paths:
      - '.github/workflows/t-display-layout-pass.yml'
      - '.github/t-display-layout-pass.py'

permissions:
  contents: write

jobs:
  patch-build-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout t-display
        uses: actions/checkout@v7
        with:
          ref: t-display

      - name: Apply layout cleanup
        run: python3 .github/t-display-layout-pass.py

      - name: Verify layout contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'display.fillRoundRect(190, 47, 122, 70, 9, risk.status)' T-Display-S3/src/display_ui.cpp
          grep -q 'drawLandscapeMetricCard(4, 28, 154, 24, "TEMP"' T-Display-S3/src/display_ui.cpp
          grep -q 'drawLandscapeMetricCard(162, 80, 154, 24, "DIRECTION"' T-Display-S3/src/display_ui.cpp
          grep -q 'return formatDateFromEpoch(now) + " " + formatClockFromEpoch(now)' T-Display-S3/src/time_utils.cpp
          grep -q 'snprintf(buf, sizeof(buf), "%d:%02d %s"' T-Display-S3/src/time_utils.cpp

      - name: Install PlatformIO
        run: python3 -m pip install --upgrade platformio

      - name: Build T-Display S3
        working-directory: T-Display-S3
        run: platformio run

      - name: Commit firmware and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/t-display-layout-pass.yml .github/t-display-layout-pass.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add T-Display-S3/src/display_ui.cpp T-Display-S3/src/time_utils.cpp .github/workflows/t-display-layout-pass.yml .github/t-display-layout-pass.py
          git commit -m 'Refine T-Display risk panel and detail layout'
          git push origin t-display
