name: Verify waiting-state firmware and emulator

on:
  push:
    paths:
      - '.github/workflows/verify-waiting-state.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install verification dependencies
        run: python -m pip install pytest platformio

      - name: Verify manifest parity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('.')
          manifest = json.loads((root / '.github/concept1-emulator-v7.11.10-manifest.json').read_text())
          for rel, expected in manifest['files'].items():
              actual = hashlib.sha256((root / 'emulator/concept-1' / rel).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'emulator manifest mismatch: {rel}: {actual} != {expected}')
          for rel, expected in manifest['firmware_sources'].items():
              actual = hashlib.sha256((root / rel).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'firmware manifest mismatch: {rel}: {actual} != {expected}')
          print('Manifest parity verified')
          PY

      - name: Run emulator tests
        working-directory: emulator/concept-1
        run: python -m pytest -q

      - name: Build T-Display-S3
        working-directory: T-Display-S3
        run: platformio run

      - name: Build Waveshare 2.8
        working-directory: Waveshare-ESP32-S3-Touch-LCD-2.8
        run: platformio run

      - name: Build Waveshare 7C BOX
        working-directory: Waveshare-ESP32-S3-Touch-LCD-7C-BOX
        run: platformio run

      - name: Remove one-time verification workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/verify-waiting-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-waiting-state.yml
          git commit -m "Remove one-time waiting-state verification workflow"
          git push origin HEAD:main
