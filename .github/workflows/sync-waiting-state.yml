name: Sync waiting state firmware and emulator

on:
  push:
    paths:
      - '.github/workflows/sync-waiting-state.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize waiting state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          ROOT = Path('.')

          def replace_function(path, name, next_name, body):
              text = path.read_text(encoding='utf-8')
              start = text.index(f'void {name}() {{')
              end = text.index(f'\nvoid {next_name}()', start)
              text = text[:start] + body.rstrip() + '\n' + text[end:]
              path.write_text(text, encoding='utf-8')

          tdisplay = ROOT / 'T-Display-S3/src/display_ui.cpp'
          replace_function(tdisplay, 'drawWaitingScreen', 'drawWeatherScreen', r'''
          void drawWaitingScreen() {
            display.fillScreen(C_BLACK);
            drawHeader();

            // Waiting state owns the complete content area between header and footer.
            drawConceptCard(8, 43, 154, 244, 11, true);
            display.setTextDatum(textdatum_t::middle_center);
            display.setFont(&fonts::Font4);
            display.setTextSize(1.0f);
            display.setTextColor(C_WHITE);
            display.drawString(setupApStarted ? "SETUP" : "WAITING", 85, 148);

            display.setFont(&fonts::Font2);
            display.setTextColor(rgb565(159, 183, 201));
            if (setupApStarted) {
              display.drawString("Connect to setup Wi-Fi", 85, 177);
              display.setFont(&fonts::Font0);
              display.setTextSize(0.85f);
              display.setTextColor(rgb565(114, 202, 255));
              display.drawString(setupApName(), 85, 199);
              display.setTextSize(1.0f);
            } else {
              display.drawString(lastApiError.length() ? "Weather API error" : "Preparing display", 85, 177);
              display.setFont(&fonts::Font0);
              display.setTextSize(0.85f);
              display.setTextColor(rgb565(114, 202, 255));
              if (WiFi.status() != WL_CONNECTED) {
                display.drawString("Connecting to Wi-Fi...", 85, 199);
              } else if (!apiConfigured()) {
                display.drawString("API setup needed", 85, 199);
              } else if (lastApiError.length()) {
                display.drawString("Check provider configuration", 85, 199);
              } else {
                display.drawString("Fetching weather...", 85, 199);
              }
              display.setTextSize(1.0f);
            }

            drawFooter();
          }
          ''')

          wave28 = ROOT / 'Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp'
          replace_function(wave28, 'drawWaitingScreen', 'drawWeatherScreen', r'''
          void drawWaitingScreen() {
            gfx->fillScreen(C_BLACK);
            headerText();

            // Waiting state owns the complete content area between header and footer.
            drawConceptCard(10, 54, 220, 208, 12, true);
            centerBoldText(setupApStarted ? "SETUP" : "WAITING", 120, 127, 4, C_WHITE);

            if (setupApStarted) {
              centerText("Connect to setup Wi-Fi", 120, 172, 1, rgb565(159, 183, 201));
              centerText(setupApName(), 120, 195, 1, rgb565(114, 202, 255));
              centerText("192.168.4.1/config", 120, 213, 1, rgb565(114, 202, 255));
            } else {
              centerText(lastApiError.length() ? "Weather API error" : "Preparing display",
                         120, 172, 1, rgb565(159, 183, 201));
              if (WiFi.status() != WL_CONNECTED) {
                centerText("Connecting to Wi-Fi...", 120, 195, 1, rgb565(114, 202, 255));
              } else if (!apiConfigured()) {
                centerText("API setup needed", 120, 195, 1, rgb565(114, 202, 255));
              } else if (lastApiError.length()) {
                centerText("Check provider configuration", 120, 195, 1, rgb565(114, 202, 255));
              } else {
                centerText("Fetching weather...", 120, 195, 1, rgb565(114, 202, 255));
              }
            }

            drawFooter();
          }
          ''')

          wave7c = ROOT / 'Waveshare-ESP32-S3-Touch-LCD-7C-BOX/src/display_ui.cpp'
          replace_function(wave7c, 'drawWaitingScreen', 'drawWeatherScreen', r'''
          void drawWaitingScreen() {
            gfx->fillScreen(C_BLACK);
            drawHeader();

            // Waiting state owns the complete content area between header and footer.
            drawConceptCard(33, 82, 734, 310, 18, true);
            centerBoldText(setupApStarted ? "SETUP" : "WAITING", 400, 164, 6, C_WHITE);

            if (setupApStarted) {
              centerBoldText("Connect to setup Wi-Fi", 400, 233, 3, rgb565(159, 183, 201));
              centerBoldText(setupApName(), 400, 281, 2, rgb565(114, 202, 255));
              centerBoldText("192.168.4.1/config", 400, 311, 2, rgb565(114, 202, 255));
            } else {
              centerBoldText(lastApiError.length() ? "Weather API error" : "Preparing display",
                             400, 233, 3, rgb565(159, 183, 201));
              if (WiFi.status() != WL_CONNECTED) {
                centerBoldText("Connecting to Wi-Fi...", 400, 281, 2, rgb565(114, 202, 255));
              } else if (!apiConfigured()) {
                centerBoldText("API setup needed", 400, 281, 2, rgb565(114, 202, 255));
              } else if (lastApiError.length()) {
                centerBoldText("Check provider configuration", 400, 281, 2, rgb565(114, 202, 255));
              } else {
                centerBoldText("Fetching weather...", 400, 281, 2, rgb565(114, 202, 255));
              }
            }

            drawFooter();
          }
          ''')

          emulator = ROOT / 'emulator/concept-1/emulator/display_ui.py'
          text = emulator.read_text(encoding='utf-8')
          replacements = [
              (
                  '''            card(8, 43, 154, 244, 11, True),\n            text(85, 148, "WAITING", 18, "middle", WHITE, "900"),\n            text(85, 177, "Weather API error" if api_error else "Fetching weather...",\n                 7.2, "middle", MUTED, "600"),''',
                  '''            card(8, 43, 154, 244, 11, True),\n            text(85, 148, "WAITING", 18, "middle", WHITE, "900"),\n            text(85, 177, "Weather API error" if api_error else "Preparing display",\n                 7.2, "middle", MUTED, "600"),\n            text(85, 199, "Check provider configuration" if api_error else "Fetching weather...",\n                 6.0, "middle", CYAN, "600"),'''
              ),
              (
                  '''            card(10, 54, 220, 208, 12, True),\n            text(120, 143, "WAITING", 23, "middle", WHITE, "900"),\n            text(120, 176, "Weather API error" if api_error else "Fetching weather...",\n                 8, "middle", MUTED, "600"),''',
                  '''            card(10, 54, 220, 208, 12, True),\n            text(120, 143, "WAITING", 23, "middle", WHITE, "900"),\n            text(120, 176, "Weather API error" if api_error else "Preparing display",\n                 8, "middle", MUTED, "600"),\n            text(120, 199, "Check provider configuration" if api_error else "Fetching weather...",\n                 7.0, "middle", CYAN, "600"),'''
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected emulator waiting-state block not found')
              text = text.replace(old, new, 1)
          emulator.write_text(text, encoding='utf-8')

          test_path = ROOT / 'emulator/concept-1/tests/test_firmware_visual_parity.py'
          tests = test_path.read_text(encoding='utf-8')
          marker = '    def test_firmware_sources_contain_current_pill_contract(self):\n'
          new_test = '''    def test_waiting_state_matches_firmware_contract(self):\n        self.app.wx.valid = False\n        renders = [\n            (tdisplay_svg, 'x="8" y="43" width="154" height="244"'),\n            (waveshare_svg, 'x="10" y="54" width="220" height="208"'),\n            (waveshare_7c_svg, 'x="33" y="82" width="734" height="310"'),\n        ]\n        for render, geometry in renders:\n            svg = render(self.app.config, self.app.wx, forecast_elapsed_seconds=0)\n            self.assertIn('WAITING', svg)\n            self.assertIn('Preparing display', svg)\n            self.assertIn('Fetching weather...', svg)\n            self.assertIn(geometry, svg)\n\n            error_svg = render(self.app.config, self.app.wx, api_error='provider failed', forecast_elapsed_seconds=0)\n            self.assertIn('Weather API error', error_svg)\n            self.assertIn('Check provider configuration', error_svg)\n\n'''
          if 'def test_waiting_state_matches_firmware_contract' not in tests:
              if marker not in tests:
                  raise SystemExit('Test insertion marker not found')
              tests = tests.replace(marker, new_test + marker, 1)

          old_contract = '''        for path in targets:\n            src = path.read_text()\n            self.assertIn("apparentRiskLabel()", src)\n            self.assertNotIn("ICON_ALERT", src)\n        self.assertIn('\"CURRENT CONDITIONS\"', targets[1].read_text())\n'''
          new_contract = '''        for path in targets:\n            src = path.read_text()\n            self.assertIn("apparentRiskLabel()", src)\n            self.assertNotIn("ICON_ALERT", src)\n            self.assertIn('"Preparing display"', src)\n            self.assertIn('"Fetching weather..."', src)\n        self.assertIn('\"CURRENT CONDITIONS\"', targets[1].read_text())\n        self.assertIn("drawConceptCard(8, 43, 154, 244", targets[0].read_text())\n        self.assertIn("drawConceptCard(10, 54, 220, 208", targets[1].read_text())\n        self.assertIn("drawConceptCard(33, 82, 734, 310", targets[2].read_text())\n'''
          if old_contract not in tests:
              raise SystemExit('Firmware contract test block not found')
          tests = tests.replace(old_contract, new_contract, 1)
          test_path.write_text(tests, encoding='utf-8')

          manifest_path = ROOT / '.github/concept1-emulator-v7.11.10-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['files']['emulator/display_ui.py'] = hashlib.sha256(emulator.read_bytes()).hexdigest()
          manifest['files']['tests/test_firmware_visual_parity.py'] = hashlib.sha256(test_path.read_bytes()).hexdigest()
          for rel in [
              'T-Display-S3/src/display_ui.cpp',
              'Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp',
              'Waveshare-ESP32-S3-Touch-LCD-7C-BOX/src/display_ui.cpp',
          ]:
              manifest['firmware_sources'][rel] = hashlib.sha256((ROOT / rel).read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Install emulator test dependency
        run: python -m pip install pytest

      - name: Run emulator parity tests
        working-directory: emulator/concept-1
        run: python -m pytest -q

      - name: Commit synchronized firmware and emulator
        shell: bash
        run: |
          rm -f .github/workflows/sync-waiting-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            T-Display-S3/src/display_ui.cpp \
            Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp \
            Waveshare-ESP32-S3-Touch-LCD-7C-BOX/src/display_ui.cpp \
            emulator/concept-1/emulator/display_ui.py \
            emulator/concept-1/tests/test_firmware_visual_parity.py \
            .github/concept1-emulator-v7.11.10-manifest.json \
            .github/workflows/sync-waiting-state.yml
          git commit -m "Synchronize waiting state across firmware and emulator"
          git push origin HEAD:main
