name: Apply Concept 1 wind chill palette

on:
  push:
    branches: [concept-1]
    paths:
      - tools/apply_concept1_wind_chill_palette.py
      - .github/workflows/apply-concept1-wind-chill-palette.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: concept-1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply palette
        run: python tools/apply_concept1_wind_chill_palette.py

      - name: Remove one-time migration files
        run: |
          rm -f tools/apply_concept1_wind_chill_palette.py
          rm -f .github/workflows/apply-concept1-wind-chill-palette.yml

      - name: Commit changes
        run: |
          git config user.name "Bob"
          git config user.email "rcronin@gmail.com"
          git add -A
          git commit -m "Concept 1: add NWS wind chill danger palette"
          git push origin HEAD:concept-1
