name: Add Concept-1 7C Emulator

on:
  push:
    branches: [concept-1]
    paths:
      - '.github/workflows/add-concept1-7c-emulator.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V7.11.10 7C emulator patch
        shell: bash
        run: |
          cat .github/7c-patch/part-* | base64 -d > /tmp/patch7c.py
          python3 /tmp/patch7c.py

      - name: Run full emulator tests
        working-directory: emulator/concept-1
        run: python3 -m unittest discover -s tests -v

      - name: Verify 7C target and parity manifest
        shell: bash
        run: |
          grep -q 'def waveshare_7c_svg' emulator/concept-1/emulator/display_ui.py
          grep -q '/render/waveshare-7c.svg' emulator/concept-1/emulator/web_ui.py
          grep -q 'Waveshare 7C BOX · 800×480' emulator/concept-1/emulator/web_ui.py
          test -f emulator/concept-1/preview_waveshare_7c_box.svg
          test -f emulator/concept-1/tests/test_waveshare_7c_box.py
          rm -f emulator/concept-1/emulator_config.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('emulator/concept-1')
          m=json.loads(Path('.github/concept1-emulator-v7.11.10-manifest.json').read_text())
          actual={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc'}
          assert len(actual)==32, len(actual)
          assert actual==m['files']
          print('V7.11.10 parity OK:',len(actual),'functional files')
          PY

      - name: Commit 7C emulator support
        shell: bash
        run: |
          find emulator/concept-1 -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f emulator/concept-1/emulator_config.json
          rm -rf .github/7c-patch .github/workflows/add-concept1-7c-emulator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Waveshare 7C-BOX to Concept-1 emulator'
          git push origin HEAD:concept-1
