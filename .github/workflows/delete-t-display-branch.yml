name: One-time delete t-display branch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-t-display-branch.yml'

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete t-display branch
        shell: bash
        run: git push origin --delete t-display

      - name: Remove this one-time workflow
        shell: bash
        run: |
          rm .github/workflows/delete-t-display-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/delete-t-display-branch.yml
          git commit -m 'Remove one-time t-display branch deletion workflow'
          git push origin HEAD:main

# one-time deletion helper
