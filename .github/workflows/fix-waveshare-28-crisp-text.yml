name: Waveshare 2.8 crisp text migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-waveshare-28-crisp-text.yml'

permissions:
  contents: write

jobs:
  migrate-build-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply crisp text patch
        run: python3 tools/fix_waveshare_28_crisp_text.py

      - name: Verify rendering contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp')
          s = p.read_text()
          start = s.index('static void printBoldAt')
          end = s.index('static void drawConceptCard', start)
          block = s[start:end]
          assert 'setCursor(x + 1' not in block
          assert 'setCursor(x, y + 1' not in block
          assert block.count('gfx->print(text);') == 2
          print('Verified single-pass text helpers')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Waveshare 2.8
        working-directory: Waveshare-ESP32-S3-Touch-LCD-2.8
        run: pio run

      - name: Commit firmware and remove migration helpers
        run: |
          rm -f tools/fix_waveshare_28_crisp_text.py
          rm -f .github/workflows/fix-waveshare-28-crisp-text.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sharpen Waveshare 2.8 text rendering'
          git push origin HEAD:main
