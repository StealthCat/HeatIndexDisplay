name: Publish V7.8.1 live provider summary fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v781-live-provider-summary.yml
      - .github/scripts/v781_patch.py

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply V7.8.1 provider-summary fixes
        run: python .github/scripts/v781_patch.py

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build T-Display S3
        working-directory: T-Display-S3
        run: platformio run

      - name: Build Waveshare 2.8
        working-directory: Waveshare-ESP32-S3-Touch-LCD-2.8
        run: platformio run

      - name: Commit and publish V7.8.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md RELEASE_V7_8_1_LIVE_PROVIDER_SUMMARY_FIX.md \
            T-Display-S3/include/config.h T-Display-S3/src/ambient_weather.cpp T-Display-S3/src/wunderground_weather.cpp \
            Waveshare-ESP32-S3-Touch-LCD-2.8/include/config.h Waveshare-ESP32-S3-Touch-LCD-2.8/src/ambient_weather.cpp Waveshare-ESP32-S3-Touch-LCD-2.8/src/wunderground_weather.cpp
          git commit -m "V7.8.1 fix live provider summary data"
          git push
