name: Publish V7.10 display polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v710-display-polish.yml
      - .github/scripts/v710_display_polish.py
      - .github/scripts/v710_display_polish_fix.py

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply V7.10 display polish
        run: |
          python .github/scripts/v710_display_polish.py
          python .github/scripts/v710_display_polish_fix.py

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build T-Display S3
        working-directory: T-Display-S3
        run: platformio run

      - name: Build Waveshare 2.8
        working-directory: Waveshare-ESP32-S3-Touch-LCD-2.8
        run: platformio run

      - name: Commit and publish V7.10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md RELEASE_V7_10_DISPLAY_POLISH.md \
            T-Display-S3/src/display_ui.cpp \
            Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V7.10 polish production display layout"
            git push
          fi
