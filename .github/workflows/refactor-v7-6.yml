name: Refactor V7.6 modular source

on:
  push:
    branches: [refactor-modular]
    paths:
      - .github/workflows/refactor-v7-6.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply modular refactor
        run: python .github/refactor_v7_6.py

      - name: Commit refactor
        shell: bash
        run: |
          rm -f .github/refactor_v7_6.py .github/workflows/refactor-v7-6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor both firmware projects into functional modules"
          git push origin HEAD:refactor-modular
