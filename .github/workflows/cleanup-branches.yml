name: Remove obsolete branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            feature-weather-source \
            noop \
            refactor-modular \
            refactor-modular-test \
            tmp-check \
            cleanup-branches \
            cleanup-branches-run \
            cleanup-branches-run2 \
            cleanup-temp \
            cleanup-final-temp \
            cleanup-really-final-temp \
            cleanup-branches-helper; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
          done
