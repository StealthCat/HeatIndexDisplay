name: T-Display degree fix

on:
  push:
    paths:
      - '.github/workflows/t-display-degree-fix.yml'

permissions:
  contents: write

jobs:
  patch-build-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout t-display
        uses: actions/checkout@v7
        with:
          ref: t-display
          fetch-depth: 0

      - name: Apply degree rendering patch
        run: python .github/t-display-degree-fix.py

      - name: Verify degree rendering contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('T-Display-S3/src/display_ui.cpp').read_text()
          assert 'METRIC_DEGREE_F' in s
          assert 'METRIC_DEGREE_ONLY' in s
          assert 'display.drawCircle(degreeCx, centerY - 5, 2, C_WHITE);' in s
          assert '"TEMP", temp, METRIC_DEGREE_F' in s
          assert '"DEW POINT", dew, METRIC_DEGREE_F' in s
          assert '"VS YDAY", delta, METRIC_DEGREE_F' in s
          assert 'METRIC_DEGREE_ONLY' in s
          print('Degree rendering contract verified')
          PY

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build T-Display S3
        working-directory: T-Display-S3
        run: platformio run

      - name: Commit firmware and remove helpers
        run: |
          rm -f .github/t-display-degree-fix.py .github/workflows/t-display-degree-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add T-Display-S3/src/display_ui.cpp .github/t-display-degree-fix.py .github/workflows/t-display-degree-fix.yml
          git commit -m 'Fix T-Display detail-page degree symbols'
          git push origin HEAD:t-display
