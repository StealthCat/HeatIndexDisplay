name: One-time Waveshare font fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-waveshare-font-fixes.yml'

permissions:
  contents: write

jobs:
  apply-build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Waveshare font fixes
        run: python3 .github/apply-waveshare-font-fixes.py

      - name: Verify no font-dependent degree bytes remain
        shell: bash
        run: |
          ! grep -q '(char)247' Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp
          ! grep -q '(char)247' Waveshare-ESP32-S3-Touch-LCD-7C-BOX/src/display_ui.cpp
          ! grep -q '%-I' Waveshare-ESP32-S3-Touch-LCD-2.8/src/time_utils.cpp
          ! grep -q '%-d' Waveshare-ESP32-S3-Touch-LCD-2.8/src/time_utils.cpp
          ! grep -q '%-I' Waveshare-ESP32-S3-Touch-LCD-7C-BOX/src/time_utils.cpp
          ! grep -q '%-d' Waveshare-ESP32-S3-Touch-LCD-7C-BOX/src/time_utils.cpp

      - name: Verify manifest firmware pins
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('.github/concept1-emulator-v7.11.10-manifest.json').read_text())
          for rel, expected in manifest['firmware_sources'].items():
              actual = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{rel}: {actual} != {expected}')
          print(f"Firmware source pins OK: {len(manifest['firmware_sources'])} files")
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build T-Display-S3
        working-directory: T-Display-S3
        run: platformio run

      - name: Build Waveshare 2.8
        working-directory: Waveshare-ESP32-S3-Touch-LCD-2.8
        run: platformio run

      - name: Build Waveshare 7C BOX
        working-directory: Waveshare-ESP32-S3-Touch-LCD-7C-BOX
        run: platformio run

      - name: Remove one-time files
        run: |
          rm .github/apply-waveshare-font-fixes.py
          rm .github/workflows/apply-waveshare-font-fixes.yml

      - name: Commit verified changes to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply T-Display font fixes to Waveshare displays'
          git push origin HEAD:main
