name: Tighten 7C apparent temperature spacing

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tighten-7c-apparent-unit-spacing.yml'

permissions:
  contents: write

jobs:
  adjust-and-verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply spacing adjustment
        run: python .github/tighten_7c_spacing.py

      - name: Install test and build tools
        run: python -m pip install pytest platformio

      - name: Run emulator tests
        working-directory: emulator/concept-1
        run: python -m pytest -q

      - name: Build Waveshare 7C BOX
        working-directory: Waveshare-ESP32-S3-Touch-LCD-7C-BOX
        run: platformio run

      - name: Commit verified adjustment
        shell: bash
        run: |
          rm -f .github/workflows/tighten-7c-apparent-unit-spacing.yml
          rm -f .github/tighten_7c_spacing.py
          find emulator/concept-1 -type d -name __pycache__ -prune -exec rm -rf '{}' '+' || true
          rm -f emulator/concept-1/emulator_config.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Tighten Waveshare 7C heat index unit spacing'
          git push origin HEAD:main
