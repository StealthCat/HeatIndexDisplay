name: Retune Waveshare 2.8 spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retune-waveshare-28-spacing.yml'
      - '.github/scripts/retune-waveshare-28-spacing.py'

permissions:
  contents: write

jobs:
  retune-build-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply layout retune
        run: python3 .github/scripts/retune-waveshare-28-spacing.py

      - name: Verify layout contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp').read_text()
          required = [
              'printBoldAt(169, 97, "HUMID", cyan, 1);',
              'printBoldAt(169, 134, "DEW PT", cyan, 1);',
              'printBoldAt(169, 171, "VS YDAY", cyan, 1);',
              'centerBoldText("DIR", 107, 214, 1',
              'centerBoldText("HIGH", 164, 225, 1',
              'centerBoldText("LOW", 207, 225, 1',
              'gfx->fillCircle(164, 290, 3, stateColor);',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing expected layout changes: ' + repr(missing))
          forbidden = ['"HUMIDITY"', '"DEW POINT"', '"FROM YDAY"', 'drawWindIcon(15, 226', 'centerBoldText("DIRECTION", 107, 214']
          present = [x for x in forbidden if x in s]
          if present:
              raise SystemExit('Old crowded layout still present: ' + repr(present))
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Waveshare 2.8
        run: platformio run -d Waveshare-ESP32-S3-Touch-LCD-2.8

      - name: Commit firmware and remove migration helpers
        run: |
          rm -f .github/scripts/retune-waveshare-28-spacing.py
          rm -f .github/workflows/retune-waveshare-28-spacing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp .github/scripts .github/workflows
          git commit -m 'Retune Waveshare 2.8 sizing and spacing'
          git push origin HEAD:main
