name: Publish V7.9 web status fixup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v79-web-fixup.yml
      - .github/scripts/v79_web_fixup.py

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply V7.9 web status fixup
        run: python .github/scripts/v79_web_fixup.py

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build T-Display S3
        working-directory: T-Display-S3
        run: platformio run

      - name: Build Waveshare 2.8
        working-directory: Waveshare-ESP32-S3-Touch-LCD-2.8
        run: platformio run

      - name: Commit and publish fixup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add T-Display-S3/src/web_ui.cpp Waveshare-ESP32-S3-Touch-LCD-2.8/src/web_ui.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V7.9 fix forecast status placement in web UI"
            git push
          fi
