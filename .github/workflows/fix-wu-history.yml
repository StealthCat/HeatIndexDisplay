name: Fix Weather Underground history mapping

on:
  push:
    branches: [feature-weather-source]
    paths:
      - .github/fix_wu_history.py
      - .github/workflows/fix-wu-history.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply history-field fixes
        run: python .github/fix_wu_history.py

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add T-Display-S3/src/wunderground_weather.cpp T-Display-S3/src/web_ui.cpp Waveshare-ESP32-S3-Touch-LCD-2.8/src/wunderground_weather.cpp Waveshare-ESP32-S3-Touch-LCD-2.8/src/web_ui.cpp
          git commit -m "Fix Weather Underground historical field mapping"
          git push origin HEAD:feature-weather-source
