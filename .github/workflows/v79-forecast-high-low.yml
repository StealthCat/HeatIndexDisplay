name: Publish V7.9 forecast high-low

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v79-forecast-high-low.yml
      - .github/scripts/v79_forecast_patch.py

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply V7.9 forecast patch
        run: python .github/scripts/v79_forecast_patch.py

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build T-Display S3
        working-directory: T-Display-S3
        run: platformio run

      - name: Build Waveshare 2.8
        working-directory: Waveshare-ESP32-S3-Touch-LCD-2.8
        run: platformio run

      - name: Commit and publish V7.9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ARCHITECTURE.md RELEASE_V7_9_FORECAST_HIGH_LOW.md \
            T-Display-S3/include T-Display-S3/src \
            Waveshare-ESP32-S3-Touch-LCD-2.8/include Waveshare-ESP32-S3-Touch-LCD-2.8/src
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V7.9 use forecast high-low and alternate tomorrow"
            git push
          fi
