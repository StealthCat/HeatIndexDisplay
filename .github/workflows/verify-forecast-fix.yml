name: Verify forecast fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-forecast-fix.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify forecast firmware parity
        shell: bash
        run: |
          set -euo pipefail
          cmp T-Display-S3/src/forecast_weather.cpp Waveshare-ESP32-S3-Touch-LCD-2.8/src/forecast_weather.cpp
          cmp T-Display-S3/src/forecast_weather.cpp Waveshare-ESP32-S3-Touch-LCD-7C-BOX/src/forecast_weather.cpp
          grep -q 'String body = http.getString();' T-Display-S3/src/forecast_weather.cpp
          grep -q 'lastForecastLatitude = wx.latitude;' T-Display-S3/src/forecast_weather.cpp
          grep -q 'FORECAST_RETRY_SECONDS \* 1000UL' T-Display-S3/src/forecast_weather.cpp

      - name: Refresh parity manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path('.github/concept1-emulator-v7.11.10-manifest.json')
          manifest = json.loads(manifest_path.read_text())

          root = Path('emulator/concept-1')
          files = {}
          for p in sorted(root.rglob('*')):
              if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc':
                  files[p.relative_to(root).as_posix()] = hashlib.sha256(p.read_bytes()).hexdigest()
          manifest['files'] = files
          manifest['file_count'] = len(files)

          firmware = manifest.setdefault('firmware_sources', {})
          for path in (
              'T-Display-S3/src/forecast_weather.cpp',
              'Waveshare-ESP32-S3-Touch-LCD-2.8/src/forecast_weather.cpp',
              'Waveshare-ESP32-S3-Touch-LCD-7C-BOX/src/forecast_weather.cpp',
          ):
              firmware[path] = hashlib.sha256(Path(path).read_bytes()).hexdigest()

          # Refresh every existing firmware pin as well, so the manifest is
          # internally consistent after recent production fixes.
          for path in list(firmware):
              firmware[path] = hashlib.sha256(Path(path).read_bytes()).hexdigest()

          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          print(f"Manifest refreshed: {len(files)} emulator files, {len(firmware)} firmware pins")
          PY

      - name: Run emulator tests
        working-directory: emulator/concept-1
        run: python3 -m unittest discover -s tests -v

      - name: Commit manifest and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/verify-forecast-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/concept1-emulator-v7.11.10-manifest.json .github/workflows/verify-forecast-fix.yml
          git commit -m 'Verify forecast fix and refresh parity pins'
          git push
