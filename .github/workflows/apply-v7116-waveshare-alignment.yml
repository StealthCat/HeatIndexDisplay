name: Apply V7.11.6 Waveshare alignment fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply Waveshare alignment fix
        run: python scripts/apply_v7116_waveshare_apparent_alignment.py

      - name: Validate patch
        run: |
          git diff --check
          git status --short
          git diff -- Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp README.md RELEASE_V7_11_6_WAVESHARE_APPARENT_ALIGNMENT.md

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build T-Display S3
        working-directory: T-Display-S3
        run: platformio run

      - name: Build Waveshare 2.8
        working-directory: Waveshare-ESP32-S3-Touch-LCD-2.8
        run: platformio run

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Waveshare-ESP32-S3-Touch-LCD-2.8/src/display_ui.cpp README.md RELEASE_V7_11_6_WAVESHARE_APPARENT_ALIGNMENT.md
          git commit -m "V7.11.6 fix Waveshare apparent temperature alignment"
          git push origin HEAD:main
